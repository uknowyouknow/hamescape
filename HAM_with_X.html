<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>탈출 게임</title>
<style>
:root{--bg:#0b1316;--text:#d9d3c4;--lamp:#e0a95a;--line:#2c3d3a;--paper:#d1d6c8;--postit:#e3d36f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Batang','바탕','Noto Serif KR',serif;line-height:1.8}
button,input{font:inherit;color:inherit}
header{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
#inv span{display:inline-block;margin-left:6px;padding:0 9px}
#inv .item{border:1px solid var(--lamp);color:var(--lamp)}
#inv .word{background:var(--postit);color:#2b2a1a;transform:rotate(-2deg);font-weight:bold}
#stage{position:relative;width:min(100% - 24px,960px);aspect-ratio:16/9;margin:14px auto;overflow:hidden;border:1px solid var(--line)}
.spot{position:absolute;border:1px dashed #5c7570;background:#ffffff08;cursor:pointer;display:flex;align-items:flex-end;padding:4px 8px;font-size:13px;color:#b8c2bb;text-align:left}
.spot:hover,.spot:focus-visible{border-color:var(--lamp);color:var(--lamp);outline:none}
.spot:disabled{cursor:default;opacity:.4}
#dark{position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(circle var(--r,120px) at var(--x,50%) var(--y,50%),transparent 0,rgba(5,8,10,var(--a,.95)) 100%)}
#room{padding:0 18px;text-align:center;font-size:15px;color:#9fb0aa}
#box{width:min(100% - 24px,960px);margin:12px auto 30px;border:1px solid var(--line);padding:16px 20px;min-height:130px;background:#0f191b}
#box p{margin:0 0 10px;white-space:pre-line}
#box button{border:1px solid var(--line);background:#16262a;padding:7px 16px;cursor:pointer;margin:0 8px 6px 0}
#box button:hover{border-color:var(--lamp)}
#box input{background:#0b1316;border:1px solid var(--line);padding:7px;width:130px;text-align:center;letter-spacing:.35em;margin-right:8px}
#box input.wide{width:min(100%,340px);letter-spacing:normal}
.bad{color:#d98b7c}.big{font-size:20px}
.clue{background:#081116;border:1px solid var(--line);padding:12px 16px;font-family:'Consolas','D2Coding',monospace;white-space:pre-line;margin:0 0 12px}
.book{background:var(--paper);color:#243c42;padding:14px 18px;margin:0 0 12px}
.book div{line-height:1.9}
.pic img{display:block;max-width:100%;max-height:340px;margin:6px auto 12px;border:1px solid var(--line)}
.cal{background:var(--paper);color:#243c42;padding:14px 18px 18px;margin:0 auto 12px;max-width:380px;position:relative}
.cal-title{text-align:center;font-size:20px;font-weight:bold;margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-head{font-size:13px;font-weight:bold;border-bottom:1px solid #9aa79c}
.cal-day{padding:3px 0;font-size:14px}
.sun{color:#a8483a}
.circled{border:2px solid #b0302a;border-radius:50%;font-weight:bold}
.cal-note{text-align:right;margin-top:8px;color:#b0302a;font-weight:bold;font-size:18px;transform:rotate(-4deg)}
.pic.empty{border:1px dashed #5c7570;padding:36px 16px;text-align:center;color:#9fb0aa;margin-bottom:12px}
</style>
</head>
<body>
<header><span id="where"></span><span id="inv"></span></header>
<div id="room"></div>
<div id="stage"><div id="dark"></div></div>
<div id="box"></div>

  cellar:{ name:'지하실', bg:'#0f1819', r:110, a:.97,
    desc:'습기 찬 어둠. 손끝에 차가운 벽이 닿는다. 어디선가 물 떨어지는 소리가 난다.',
    spots:[ {id:'puddle',label:'물웅덩이',x:10,y:62,w:22,h:20},
            {id:'cellarDoor',label:'철문',x:70,y:12,w:20,h:66} ]},
  gate:{ name:'빈 방', bg:'#101a1b', r:115, a:.96,
    desc:'아무것도 없는 방이다. 맞은편 문 옆에 여섯 자리 번호판이 붙어 있다.',
    spots:[ {id:'gateLock',label:'번호판',x:62,y:20,w:24,h:56} ]},
  library:{ name:'서재', bg:'#131c1c', r:120, a:.96,
    desc:'낡은 책꽂이가 벽 한쪽을 채우고 있다. 반대편 문에는 번호판이 달려 있다.',
    spots:[ {id:'shelf',label:'책꽂이',x:8,y:10,w:38,h:72},
            {id:'libLock',label:'번호판',x:68,y:20,w:22,h:56} ]},
  hall:{ name:'복도', bg:'#121d1e', r:125, a:.95,
    desc:'지하실 밖은 좁은 복도다. 벽에 그림이 걸려 있고, 끝에는 잠긴 문이 있다.',
    spots:[ {id:'art',label:'벽에 걸린 그림',x:10,y:16,w:30,h:40},
            {id:'hallDoor',label:'잠긴 문',x:68,y:12,w:22,h:66} ]}
};

const ACTIONS = {
  puddle(){ say('차가운 물이 고여 있다. 천장에서 한 방울씩 떨어진다.'); },
  cellarDoor(){ say('녹슨 철문이 삐걱 소리를 내며 열린다.',[['나간다',()=>go(S.flags.libOpen?'hall':S.flags.gateOpen?'library':'gate')]]); },
  gateLock(){
    if (S.flags.gateOpen) return go('library');
    ask({ len:6, pre:'gate',
      text:'번호판 위에 누군가 긁어 쓴 글씨가 있다.',
      extra:[el('div','"구차한 별명은 필요 없어, 이미 너무 많은 일이 지나가버렸고 넌 사사건건 일을 방해했지.."','clue')],
      onOk:()=>{ S.flags.gateOpen=true; save(); say('딸깍. 문이 열렸다.',[['들어간다',()=>go('library')]]); } });
  },
  shelf(){
    show([el('p','책들 사이에 무언가 끼워져 있다. 꺼내 보니 달력이다.'), calendar()],
         [['닫기',()=>say(ROOMS[S.room].desc)]]);
  },
  libLock(){
    if (S.flags.libOpen) return go('hall');
    ask({ len:3, pre:'library',
      text:'번호판 아래에 작게 적혀 있다.',
      extra:[el('div','힌트: *(또는 X)','clue')],
      onOk:()=>{ S.flags.libOpen=true; save(); say('딸깍. 문이 열렸다.',[['나간다',()=>go('hall')]]); } });
  },
  art(){
    show([el('p','벽에 그림이 걸려 있다. 가만히 들여다본다.'), imageBox(IMG.puzzle1)],
         [['닫기',()=>say(ROOMS[S.room].desc)]]);
  },
  hallDoor(){
    if (S.flags.hallOpen) return go('study');
    ask({ stage:1, len:4, text:'네 자리 숫자 자물쇠가 걸려 있다.' });
  }
};

const PRE = {
  gate:'bcd56c1fa3b206fa4f2f29fab8f375ff430a2afcb37005dcc8a68d97ad51a99e',
  library:'8d1921ee68dd7813d8242f3102d89e9bbe25df733a83d6db69463c09080303ef'
};
async function sha256(s){
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

function calendar(){
  const w=el('div','','cal');
  w.appendChild(el('div','7월','cal-title'));
  const g=el('div','','cal-grid');
  ['일','월','화','수','목','금','토'].forEach((d,i)=>g.appendChild(el('div',d,'cal-head'+(i===0?' sun':''))));
  for(let i=0;i<3;i++) g.appendChild(el('div'));            // 7월 1일 = 수요일
  for(let d=1;d<=31;d++){
    const c=el('div',String(d),'cal-day');
    if((d+2)%7===0) c.classList.add('sun');
    if(d===13||d===14) c.classList.add('circled');
    g.appendChild(c);
  }
  w.appendChild(g);
  w.appendChild(el('div','햄 MT!!','cal-note'));
  return w;
}

const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(answers, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(answers.join('|')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt, iterations:LOCKED.iter},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}

async function unlock(stage, answers){
  const p = LOCKED.stages[stage-1];
  try{
    const key = await deriveKey(answers, b64(p.salt));
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(p.iv)}, key, b64(p.data));
    return new Function(new TextDecoder().decode(plain))();
  }catch(e){ return null; }
}

let S = newState();
function newState(){ return { room:'cellar', items:[], words:[], flags:{}, solved:[] }; }
const $ = id => document.getElementById(id);
const has = k => S.items.includes(k);

function el(tag,text,cls){ const e=document.createElement(tag); if(text) e.textContent=text; if(cls) e.className=cls; return e; }
function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
function commit(){ save(); render(); }
function addItem(k){ if(!has(k)) S.items.push(k); commit(); }
function addWord(w){ if(!S.words.includes(w)) S.words.push(w); commit(); }
function go(room){ S.room=room; commit(); say(ROOMS[room].desc); }

function show(nodes,buttons=[]){
  const b=$('box'); b.innerHTML='';
  nodes.forEach(n=>b.appendChild(n));
  buttons.forEach(([label,fn])=>{ const x=el('button',label); x.onclick=fn; b.appendChild(x); });
}
function say(text,buttons){ show([el('p',text)],buttons||[]); }

function ask(o){
  const mode=o.mode||'digits';
  const input=el('input'); input.autocomplete='off'; input.spellcheck=false; input.setAttribute('aria-label','정답 입력');
  if(mode==='text'){ input.maxLength=40; input.className='wide'; input.placeholder='여기에 입력'; }
  else { input.maxLength=o.len; input.placeholder='_'.repeat(o.len); if(mode==='digits') input.inputMode='numeric'; }
  input.addEventListener('input',()=>{
    if(mode==='digits') input.value=input.value.replace(/\D/g,'');
    if(mode==='upper')  input.value=input.value.replace(/[^a-zA-Z]/g,'').toUpperCase();
  });
  const norm=s=> mode==='text' ? s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!]+$/,'') : s;
  const msg=el('p','','bad');
  const ok=el('button','입력');
  let busy=false;
  const check=async()=>{
    if(busy || !input.value) return;
    busy=true; ok.disabled=true; msg.textContent='확인 중...';
    const v=norm(input.value);
    if(o.pre){
      const good = (await sha256('ham_pre|'+o.pre+'|'+v))===PRE[o.pre];
      busy=false; ok.disabled=false;
      if(good) return o.onOk();
      msg.textContent=o.wrong||'맞지 않는다.'; input.value=''; input.focus(); return;
    }
    const onOk = S.solved.length===o.stage-1 ? await unlock(o.stage,[...S.solved,v]) : null;
    busy=false; ok.disabled=false;
    if(onOk){ S.solved.push(v); save(); onOk(); }
    else { msg.textContent=o.wrong||'맞지 않는다.'; input.value=''; input.focus(); }
  };
  input.onkeydown=e=>{ if(e.key==='Enter') check(); };
  ok.onclick=check;
  const no=el('button','그만둔다'); no.onclick=()=>say(ROOMS[S.room].desc);
  const row=el('div'); row.append(input,ok,no);
  show([el('p',o.text),...(o.extra||[]),row,msg]);
  input.focus();
}

function imageBox(src){
  const w=el('div','','pic'); const img=new Image(); img.alt='문제 그림'; img.src=src;
  img.onerror=()=>{ w.className='pic empty'; w.textContent='[그림을 불러오지 못했습니다]'; };
  w.appendChild(img); return w;
}

function render(){
  const r=ROOMS[S.room];
  $('where').textContent=r.name; $('room').textContent=r.desc;
  const inv=$('inv'); inv.innerHTML='';
  S.items.forEach(k=>inv.appendChild(el('span',ITEMS[k],'item')));
  S.words.forEach(w=>inv.appendChild(el('span',w,'word')));
  const stage=$('stage'), dark=$('dark');
  stage.style.background=r.bg;
  dark.style.setProperty('--r',r.r+'px'); dark.style.setProperty('--a',r.a);
  stage.querySelectorAll('.spot').forEach(e=>e.remove());
  r.spots.forEach(sp=>{
    const b=el('button',sp.label,'spot');
    Object.assign(b.style,{left:sp.x+'%',top:sp.y+'%',width:sp.w+'%',height:sp.h+'%'});
    b.onclick=ACTIONS[sp.id];
    b.onfocus=()=>light(sp.x+sp.w/2,sp.y+sp.h/2);
    stage.insertBefore(b,dark);
  });
}

function light(x,y){ const d=$('dark'); d.style.setProperty('--x',x+'%'); d.style.setProperty('--y',y+'%'); }
function follow(e){ const r=$('stage').getBoundingClientRect(); light((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100); }
$('stage').addEventListener('pointermove',follow);
$('stage').addEventListener('pointerdown',follow);

function start(){
  S=newState(); save(); render();
  say('눈을 뜨자 아무것도 보이지 않는다. 손을 뻗어 주변을 더듬어 본다.\n(마우스를 움직여 빛으로 주변을 비춰 보세요)');
}


(async function init(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(SAVE_KEY)); }catch(e){}
  if(!(saved && Array.isArray(saved.solved))) return start();
  say('기록을 불러오는 중...');
  for(let i=0;i<saved.solved.length;i++){
    if(!await unlock(i+1, saved.solved.slice(0,i+1))) return start();
  }
  if(!ROOMS[saved.room]) return start();
  S=Object.assign(newState(),saved); render();
  say('이전 기록이 남아 있다.',[['이어하기',()=>say(ROOMS[S.room].desc)],['새로 시작',start]]);
})();
</script>
